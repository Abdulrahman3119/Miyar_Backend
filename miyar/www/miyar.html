<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light" />
	<meta name="theme-color" content="#104840" />
	<title>معيار — المنصة الوطنية لاختبارات التربة والطرق</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />

	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" />
	<link rel="stylesheet" href="/assets/miyar/frontend/miyar-app.css" />

	<style>
		html, body, #root { margin: 0; height: 100%; background: #EEF2F1; }
		.miyar-boot {
			display: grid; place-items: center; height: 100%;
			font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
			color: #4D5761; font-size: 13.5px;
		}
	</style>
	<script>
		window.__MIYAR_EMBEDDED__ = true;
		window.csrf_token = {{ csrf_token|tojson }};
		window.__MIYAR_DESK_USER__ = {{ miyar_user|tojson }};
		window.__MIYAR_LOGGED_IN__ = {{ miyar_logged_in }};
		window.__MIYAR_AUTH__ = {{ miyar_auth|tojson }};
		window.__MIYAR_BOOT__ = {{ miyar_boot|tojson }};
	</script>
</head>
<body>
	<div id="root"><div class="miyar-boot">جارٍ تحميل معيار…</div></div>
	<script type="module" src="/assets/miyar/frontend/miyar-app.js?v={{ frappe.utils.cstr(frappe.utils.now()) }}"></script>
